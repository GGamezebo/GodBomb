  </defs>
  <ellipse cx="60" cy="68" rx="50" ry="11" fill="#000000" opacity="0.32"/>
  <ellipse cx="60" cy="58" rx="54" ry="50" fill="url(#bezel)" stroke="#6b4a2a" stroke-width="4"/>
  <ellipse cx="60" cy="56" rx="44" ry="40" fill="url(#well)" stroke="#8a5a32" stroke-width="2"/>
  <!-- orbit seats -->
  <circle cx="60" cy="28" r="4" fill="#c47a3a" opacity="0.85"/>
  <circle cx="88" cy="48" r="4" fill="#c47a3a" opacity="0.85"/>
  <circle cx="80" cy="78" r="4" fill="#c47a3a" opacity="0.85"/>
  <circle cx="40" cy="78" r="4" fill="#c47a3a" opacity="0.85"/>
  <circle cx="32" cy="48" r="4" fill="#c47a3a" opacity="0.85"/>
  <!-- phone flat on table -->
  <rect x="44" y="40" width="32" height="42" rx="5" fill="url(#phone)" stroke="#d48a48" stroke-width="2.5"/>
  <rect x="48" y="46" width="24" height="28" rx="2" fill="url(#screen)"/>
  <circle cx="60" cy="80" r="2.2" fill="#e8a45c"/>
  <!-- pin / fixed lock -->
  <circle cx="60" cy="58" r="7" fill="none" stroke="#fff4ea" stroke-width="2.2" opacity="0.9"/>
  <circle cx="60" cy="58" r="2.6" fill="#fff4ea"/>
  <path d="M60 51 L60 44" stroke="#fff4ea" stroke-width="2.2" stroke-linecap="round"/>
