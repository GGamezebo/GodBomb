<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="50%" stop-color="#3a2e24"/>
      <stop offset="100%" stop-color="#221a14"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a221c"/>
      <stop offset="100%" stop-color="#120e0b"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a30"/>
      <stop offset="100%" stop-color="#1c1410"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a45c"/>
      <stop offset="100%" stop-color="#a85828"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="68" rx="50" ry="11" fill="#000000" opacity="0.32"/>
  <ellipse cx="60" cy="58" rx="54" ry="50" fill="url(#bezel)" stroke="#6b4a2a" stroke-width="4"/>
  <ellipse cx="60" cy="56" rx="44" ry="40" fill="url(#well)" stroke="#8a5a32" stroke-width="2"/>
  <!-- circular pass arrows -->
  <path d="M60 30 A26 26 0 0 1 86 56" fill="none" stroke="#e8a45c" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M82 50 L88 56 L78 58" fill="none" stroke="#e8a45c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 82 A26 26 0 0 1 34 56" fill="none" stroke="#e8a45c" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M38 62 L32 56 L42 54" fill="none" stroke="#e8a45c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- phone being passed -->
  <g transform="rotate(-18 60 56)">
    <rect x="48" y="40" width="24" height="34" rx="4" fill="url(#phone)" stroke="#d48a48" stroke-width="2.2"/>
    <rect x="51" y="45" width="18" height="22" rx="1.5" fill="url(#screen)"/>
    <circle cx="60" cy="70" r="1.8" fill="#e8a45c"/>
  </g>
